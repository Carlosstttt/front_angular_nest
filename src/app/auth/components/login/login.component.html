<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <img src="assets/layout/images/logo-dark.svg" alt="Sakai logo" class="mb-5 w-6rem flex-shrink-0">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">Bienvenido</div>
                    <span class="text-600 font-medium">Inicia sesión para continuar</span>
                </div>

                <!-- Conectamos tu FormGroup al contenedor del diseño Sakai -->
                <form [formGroup]="loginForm">
                    <label for="email1" class="block text-900 text-xl font-medium mb-2">Correo</label>
                    <input id="email1" type="email" formControlName="email" placeholder="Correo electrónico" class="w-full md:w-30rem mb-5 p-3 border-1 surface-border border-round">

                    <label for="password1" class="block text-900 font-medium text-xl mb-2">Contraseña</label>
                    <input id="password1" type="password" formControlName="password" placeholder="Contraseña" class="w-full md:w-30rem mb-5 p-3 border-1 surface-border border-round">

                    <div class="flex align-items-center justify-content-between mb-5 gap-5">
                        <div class="flex align-items-center">
                            <input type="checkbox" id="rememberme1" class="mr-2">
                            <label for="rememberme1">Recordarme</label>
                        </div>
                        <a class="font-medium no-underline ml-2 text-right cursor-pointer" style="color: var(--primary-color)">¿Olvidaste tu contraseña?</a>
                    </div>

                    <!-- Conectamos tu método funIngresar() y la validación !loginForm.valid -->
                    <button type="button" (click)="funIngresar()" [disabled]="!loginForm.valid" class="w-full p-3 text-xl bg-primary border-none border-round text-white cursor-pointer">
                        Ingresar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
