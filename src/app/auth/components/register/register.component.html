<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden py-5">
    <div class="flex flex-column align-items-center justify-content-center">
        <img src="assets/layout/images/logo-dark.svg" alt="Sakai logo" class="mb-4 w-6rem flex-shrink-0">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-6 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-4">
                    <div class="text-900 text-3xl font-medium mb-2">Crear Cuenta</div>
                    <span class="text-600 font-medium">Regístrate para acceder al sistema</span>
                </div>

                <form [formGroup]="registerForm" (ngSubmit)="funRegistrar()">
                    <div class="grid">
                        <div class="col-12 md:col-6 mb-3">
                            <label for="nombres" class="block text-900 font-medium mb-2">Nombres</label>
                            <input id="nombres" type="text" formControlName="nombres" placeholder="Tus nombres" class="w-full p-3 border-1 surface-border border-round">
                        </div>
                        <div class="col-12 md:col-6 mb-3">
                            <label for="apellidos" class="block text-900 font-medium mb-2">Apellidos</label>
                            <input id="apellidos" type="text" formControlName="apellidos" placeholder="Tus apellidos" class="w-full p-3 border-1 surface-border border-round">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="identificacion" class="block text-900 font-medium mb-2">Número de Cédula</label>
                        <input id="identificacion" type="text" maxlength="10" formControlName="identificacion" placeholder="Ej: 1712345678" class="w-full md:w-30rem p-3 border-1 surface-border border-round">
                        <small *ngIf="registerForm.get('identificacion')?.touched && registerForm.get('identificacion')?.errors" class="block text-red-500 mt-1">
                            {{ registerForm.get('identificacion')?.errors?.['cedulaInvalida'] || 'La cédula es obligatoria' }}
                        </small>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="block text-900 font-medium mb-2">Correo Electrónico</label>
                        <input id="email" type="email" formControlName="email" placeholder="correo@ejemplo.com" class="w-full md:w-30rem p-3 border-1 surface-border border-round">
                        <small *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors" class="block text-red-500 mt-1">
                            Ingresa un correo electrónico válido.
                        </small>
                    </div>

                    <div class="mb-3">
                        <label for="telefono" class="block text-900 font-medium mb-2">Teléfono (Opcional)</label>
                        <input id="telefono" type="text" formControlName="telefono" placeholder="0999999999" class="w-full md:w-30rem p-3 border-1 surface-border border-round">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="block text-900 font-medium mb-2">Contraseña</label>
                        <input id="password" type="password" formControlName="password" placeholder="Mínimo 6 caracteres" class="w-full md:w-30rem p-3 border-1 surface-border border-round">
                        <small *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors" class="block text-red-500 mt-1">
                            La contraseña debe tener al menos 6 caracteres.
                        </small>
                    </div>

                    <button type="submit" [disabled]="!registerForm.valid" class="w-full p-3 text-xl bg-primary border-none border-round text-white cursor-pointer mb-3">
                        Registrarse
                    </button>

                    <div class="text-center">
                        <span class="text-600">¿Ya tienes cuenta? </span>
                        <a routerLink="/auth/login" class="font-medium no-underline cursor-pointer" style="color: var(--primary-color)">Inicia sesión aquí</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
