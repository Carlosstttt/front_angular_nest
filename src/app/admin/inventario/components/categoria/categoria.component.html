<div class="card">
    <h1>Categorias</h1>

    <p-button (click)="showDialog()" label="Nueva Categoría" icon="pi pi-plus" class="mb-3"></p-button>

    <p-dialog header="Nueva Categoría" [(visible)]="visible" [modal]="true" [style]="{ width: '25rem' }">
        <div class="flex flex-column gap-2 mb-3">
            <label for="nombre" class="font-semibold">Nombre</label>
            <input pInputText id="nombre" [(ngModel)]="nombre" autocomplete="off" />
        </div>
        <div class="flex flex-column gap-2 mb-4">
            <label for="descripcion" class="font-semibold">Descripción</label>
            <input pInputText id="descripcion" [(ngModel)]="descripcion" autocomplete="off" />
        </div>
        <ng-template pTemplate="footer">
            <p-button label="Cancelar" severity="secondary" (click)="visible = false"></p-button>
            <p-button label="Guardar" (click)="guardarCategoria()"></p-button>
        </ng-template>
    </p-dialog>

    <p-table [value]="categorias" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Descripción</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-categoria>
            <tr>
                <td>{{ categoria.id }}</td>
                <td>{{ categoria.nombre }}</td>
                <td>{{ categoria.descripcion }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
